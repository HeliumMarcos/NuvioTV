name: Experimental E-AC-3 Android build

on:
  push:
    branches:
      - feature/eac3-transcoding
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-eac3-armv7:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      FFMPEG_TARGET_ABI: armeabi-v7a
      FFMPEG_BUILD_JOBS: '4'
      USE_LOCAL_FFMPEG_DECODER: 'true'
      CI_USE_DEBUG_SIGNING: 'true'
      FFMPEG_SOURCE_DIR: ${{ github.workspace }}/ffmpeg-decoder-downmix/src/main/jni/ffmpeg
      FFMPEG_BUILD_DIR: ${{ github.workspace }}/ffmpeg-decoder-downmix/src/main/jni/ffmpeg/android-libs
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # v4 installs the command-line tools and puts sdkmanager on PATH.
      # Unlike v3, it no longer requests the removed legacy 'tools' package.
      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Verify SDK command-line tools
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?\"ANDROID_HOME is not set\"}"
          command -v sdkmanager
          sdkmanager --version
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build dependencies
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
          test -x "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang"
      - name: Restore stable experimental debug signing key
        env:
          EAC3_DEBUG_KEYSTORE_BASE64: ${{ secrets.EAC3_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$EAC3_DEBUG_KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$EAC3_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Fetch pinned FFmpeg source
        run: |
          git clone --depth 1 --branch n7.1.2 https://github.com/FFmpeg/FFmpeg.git "$FFMPEG_SOURCE_DIR"
      - name: Compile FFmpeg decoders and AC-3 / E-AC-3 encoders for armeabi-v7a
        run: |
          bash ffmpeg-decoder-downmix/src/main/jni/build_ffmpeg.sh \
            "$PWD/ffmpeg-decoder-downmix/src/main" \
            "$ANDROID_HOME/ndk/29.0.14206865" \
            linux-x86_64 24 \
            truehd ac3 eac3 dca aac flac alac vorbis opus mp3
      - name: Compile native JNI and Java decoder (armeabi-v7a)
        run: |
          ./gradlew :ffmpeg-decoder-downmix:assembleDebug \
            -Pandroid.injected.build.abi=armeabi-v7a \
            --stacktrace --no-daemon
      - name: Assemble experimental NuvioTV debug APK
        run: |
          ./gradlew :app:assembleFullDebug :app:testFullDebugUnitTest \
            --tests com.nuvio.tv.data.local.PlayerSettingsTranscodingTest \
            -PuseLocalFfmpegDecoder=true \
            -Pandroid.injected.testOnly=false \
            -Pandroid.injected.build.abi=armeabi-v7a \
            --stacktrace --no-daemon
      - name: Collect and verify experimental full debug APK
        run: |
          set -euo pipefail
          echo "Build outputs in workspace:"
          find . -type f \( -name '*.apk' -o -name '*.aar' \) -print | head -100
          mkdir -p "$RUNNER_TEMP/eac3-apk"
          mapfile -d '' apks < <(find . -type f -name '*full*debug*.apk' -print0)
          if (( ${#apks[@]} == 0 )); then
            echo "::error::No full debug APK found. Inspect Gradle output layout."
            find . -type d -name outputs -print | head -50
            exit 1
          fi
          for apk in "${apks[@]}"; do
            case "$(basename "$apk")" in
              *armeabi-v7a*)
                "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | sed -n '1p' | grep -F "name='com.nuvio.tv.eac3'"
                "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
                manifest_dump=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml)
                if grep -Eq 'android:testOnly.*0xffffffff' <<< "$manifest_dump"; then
                  echo "::error::Experimental APK must not be test-only"
                  exit 1
                fi
                cp "$apk" "$RUNNER_TEMP/eac3-apk/"
                ;;
            esac
          done
          test -n "$(find "$RUNNER_TEMP/eac3-apk" -type f -name "*.apk" -print -quit)"
          ls -lh "$RUNNER_TEMP/eac3-apk"
      - name: Upload experimental debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nuviotv-eac3-experimental-armeabi-v7a-debug-apk
          path: ${{ runner.temp }}/eac3-apk/*.apk
          if-no-files-found: error
      - name: Upload compiled decoder AAR
        uses: actions/upload-artifact@v4
        with:
          name: experimental-eac3-decoder-armeabi-v7a
          path: ffmpeg-decoder-downmix/build/outputs/aar/ffmpeg-decoder-downmix-debug.aar
          if-no-files-found: error
